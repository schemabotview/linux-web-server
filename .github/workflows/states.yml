# Build the saved machines and publish them as the `states` release (scripts/states.py).
# A cloud session may not write releases, so this runs here: on the same Ubuntu 24.04 and QEMU 8.2
# the cloud sessions use, so every state it saves resumes there. It rebuilds the base, re-records
# every step, publishes the states, checks a pull, and commits the matching transcripts.
name: states

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/states.yml, scripts/**, spine/**/step.json]

permissions:
  contents: write

concurrency:
  group: states

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the recorder's tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils genisoimage zstd openssh-client socat
          qemu-system-x86_64 --version | head -1
          pip install -r scripts/requirements.txt

      - name: Build the base
        run: python3 -u scripts/base.py

      - name: Record every step, in chain order
        run: |
          steps=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from record import SPINE, chain_of
          print(' '.join(sorted((str(p.parent.relative_to(SPINE)) for p in SPINE.rglob('step.json')), key=lambda s: len(chain_of(s)))))")
          echo "steps=$steps" >> "$GITHUB_ENV"
          python3 -u scripts/record.py $steps

      - name: Check
        run: python3 scripts/record.py --check

      - name: Publish the states
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -u scripts/states.py push --all

      - name: Pull them back into a fresh folder and compare
        run: |
          (cd .machine/states && find . -type f -exec sha256sum {} + | sort -k2) > /tmp/local.sha
          mv .machine/states .machine/states.local
          python3 -u scripts/states.py pull $steps
          (cd .machine/states && find . -type f -exec sha256sum {} + | sort -k2) > /tmp/pulled.sha
          diff /tmp/local.sha /tmp/pulled.sha && echo "pulled states match"

      - name: Commit the transcripts that match the published states
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spine
          git diff --cached --quiet && exit 0
          git commit -m "Re-record the spine with the published states (states workflow run ${{ github.run_id }})"
          git push origin HEAD:${{ github.ref_name }}
